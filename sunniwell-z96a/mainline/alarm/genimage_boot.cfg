# ============================================================
#  Sunniwell Z96A (RK3568) — genimage 配置: 完整磁盘镜像
# ============================================================
#  包含分区:
#    0     idbloader — 第一级引导 (TPL+SPL), 裸数据 @ 扇区 64 (0x8000 字节),
#                     不进 GPT; 大小 4161536 B, 恰好填满扇区 64~8191。
#    1~8   原机 boot 栈: security uboot trust misc proinfo dtbo vbmeta boot
#    9     BOOT (256M) — mainline Linux /boot (FAT32, kernel+dtb+extlinux)
#    10    ROOT (grow) — mainline Linux /     (ext4 rootfs, GPT 记录占满剩余)
#  偏移: 1~8 与设备原始 GPT 完全一致 (512B/扇区; 1 MiB = 0x800 扇区);
#        BOOT/ROOT 紧接 boot 之后, 1 MiB 对齐, 无间隙。
#  GPT: 磁盘总大小 = 61071360 扇区 (512B) = 29820 MiB (~29.1 GiB),
#       ROOT 从 349 MiB 起 autoresize 占满剩余空间 (29471 MiB)。
#       生成后把输出截断到 8541 MiB (~8.34 GiB = 349M + 8G root.img):
#       实际镜像只有 ~8G, 但 GPT 记录完整 29 GiB, 刷入 eMMC 后 ROOT 占满全盘。
# ============================================================

image ArchLinuxARM-aarch64-latest.img {
    hdimage {
        partition-table-type = "gpt"
    }
    size = 29820M

    partition idbloader {
        offset = 32K
        image = "../../backup/Z96A-TYPEC/partitions/idbloader.img"
        in-partition-table = false
    }
    partition security {
        offset = 4M
        size = 4M
        image = "../../backup/Z96A-TYPEC/partitions/security_mmcblk2p1.img"
    }
    partition uboot {
        offset = 8M
        size = 4M
        image = "../../backup/Z96A-TYPEC/uboot/uboot_patched_BOOT.img"
    }
    partition trust {
        offset = 12M
        size = 4M
        image = "../../backup/Z96A-TYPEC/partitions/trust_mmcblk2p3.img"
    }
    partition misc {
        offset = 16M
        size = 4M
        image = "../../backup/Z96A-TYPEC/partitions/misc_mmcblk2p4.img"
    }
    partition proinfo {
        offset = 20M
        size = 4M
        image = "../../backup/Z96A-TYPEC/partitions/proinfo_mmcblk2p5.img"
    }
    partition dtbo {
        offset = 24M
        size = 4M
        image = "../../backup/Z96A-TYPEC/partitions/dtbo_mmcblk2p6.img"
    }
    partition vbmeta {
        offset = 28M
        size = 1M
        image = "../../backup/Z96A-TYPEC/partitions/vbmeta_mmcblk2p7.img"
    }
    partition boot {
        offset = 29M
        size = 64M
        image = "../../backup/Z96A-TYPEC/partitions/boot_mmcblk2p8.img"
    }
    partition BOOT {
        offset = 93M
        size = 256M
        image = "boot.img"
    }
    partition ROOT {
        offset = 349M
        image = "root.img"
        autoresize = true
    }
}
